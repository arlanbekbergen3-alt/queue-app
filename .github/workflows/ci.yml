name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: queue_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/queue_db
      JWT_SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
      TEACHER_INVITE_CODE: ci-invite-code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Apply migrations
        run: alembic upgrade head
      - name: Models match migrations
        run: alembic check
      - name: Tests with coverage
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=90
      - name: Install browser for e2e tests
        run: python -m playwright install --with-deps chromium
      - name: Browser (e2e) tests
        run: pytest -m e2e --no-cov -q
